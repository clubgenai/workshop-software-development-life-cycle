# Publie le dossier presentation/ sur GitHub Pages à chaque push sur main.
# Seul presentation/ est mis en ligne : docs/, social/ et le reste du dépôt ne sont pas publiés.
name: Publier la présentation

on:
  push:
    branches: [main]
    paths:
      - "presentation/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: presentation
      - id: deployment
        uses: actions/deploy-pages@v4
